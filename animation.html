<hmtl><head><style>
    .box {
        width: 120px;
        height: 120px;
        background-color: lightgreen;
        /*animation properties*/
        animation-name: moveBox;
        animation-duration: 2s;
        animation-iteration-count: infinite;
    }

    @keyframes moveBox{
        from {
            transform: translateX(800px);
        }
    }
</style></head>
<body>
    <div class="box"></div>
</body>
</hmtl>
