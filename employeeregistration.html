<html>
    <head>
        <title> Employee Registration </title>
</head> 
    <body> 
        <h1> Employee Registration form </h1>
        <form>
    Name : <input type="text" name="g1" placeholder="Enter your name" autofocus><br><br> 
    Password : <input type="password" name="g2"  minlength="6" reqired> <br><br>
   Email : <input type="email" name="g3" placeholder="abc@klh.edu.in" required> <br><br>
   Mobile : <input type="tel" name="g4" placeholder="Enter your mobile" pattern="[0-9]{10}" required> <br><br>
   Age : <input type="age" name="g5"> <br><br>
   Gender : <input type="radio" name="g5" value="male">Male
     <input type="radio" name="g5" value="female">Female 
     <input type="radio" name="g5" value="other">Other<br><br>
     Date of birth : <input type="date" name="g6"> <br><br>
     Prefered interview time : <input type="time" name="g7"> <br><br>
     Skills : <input type="checkbox" name="g7">HTML
     <input type="checkbox" name="g7" >CSS
        <input type="checkbox" name="g7">JAVASCRIPT
        <input type="checkbox" name="g7">PHP<BR><br>  
     
            Upload Resume : <input type="file" name="g9" accept=".jpg,.jpeg,.png">
            <br><br> 
              Adress : <textarea name="g6" required rows="4" cols="67"
     placeholder="Enter your address"> 
     </textarea><br><br>  
     Work experience : <input type="range" name="g7"> <br><br>
     LinkedIn profile : <input type="text" name="g8" placeholder="Enter the URL"> <br><br>

     <button type="submit"> Submit </button>
            <button type="Clear all">Clear all</button>


</form>
 
    </body>
</html>
